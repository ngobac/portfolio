  <!-- ════════════════════════════════════════════════════════
       FadingVideo — rAF crossfade, no CSS transitions
  ════════════════════════════════════════════════════════ -->
  <script type="text/babel">
  window.FadingVideo = function FadingVideo({ src, className, style }) {
    const vRef = React.useRef(null);
    const rafRef = React.useRef(null);
    const fadingOut = React.useRef(false);
    const FADE_MS = 500, LEAD = 0.55;

    const fadeTo = React.useCallback((target) => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      const v = vRef.current; if (!v) return;
      const t0 = performance.now();
      const from = parseFloat(v.style.opacity) || 0;
      const step = (now) => {
        const p = Math.min((now - t0) / FADE_MS, 1);
        v.style.opacity = (from + (target - from) * p).toString();
        if (p < 1) rafRef.current = requestAnimationFrame(step);
      };
      rafRef.current = requestAnimationFrame(step);
    }, []);

    React.useEffect(() => {
      const v = vRef.current; if (!v) return;
      const onData = () => { v.style.opacity = '0'; v.play().catch(() => {}); fadeTo(1); };
      const onTime = () => {
        if (!fadingOut.current && v.duration &&
            v.duration - v.currentTime <= LEAD && v.duration - v.currentTime > 0) {
          fadingOut.current = true; fadeTo(0);
        }
      };
      const onEnd = () => {
        v.style.opacity = '0';
        setTimeout(() => {
          v.currentTime = 0; v.play().catch(() => {});
          fadingOut.current = false; fadeTo(1);
        }, 100);
      };
      v.addEventListener('loadeddata', onData);
      v.addEventListener('timeupdate', onTime);
      v.addEventListener('ended',      onEnd);
      return () => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        v.removeEventListener('loadeddata', onData);
        v.removeEventListener('timeupdate', onTime);
        v.removeEventListener('ended',      onEnd);
      };
    }, [fadeTo]);

    return (
      <video ref={vRef} src={src} autoPlay muted playsInline preload="auto"
             className={className} style={{ opacity: 0, ...style }} />
    );
  };
  </script>

  window.BlurText = function BlurText({ text, className }) {
    const { motion, useInView } = window.Motion;
    const ref = React.useRef(null);
    const inView = useInView(ref, { amount: 0.1, once: true });
    return (
      <p ref={ref}
         style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
         className={className}>
        {text.split(' ').map((w, i) => (
          <motion.span key={i}
            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
            animate={inView ? {
              filter:  ['blur(10px)', 'blur(5px)', 'blur(0px)'],
              opacity: [0, 0.5, 1],
              y:       [50, -5, 0],
            } : {}}
            transition={{ duration: 0.7, delay: i * 0.1, ease: 'easeOut', times: [0, 0.5, 1] }}
            style={{ display: 'inline-block', marginRight: '0.28em' }}>
            {w}
          </motion.span>
        ))}
      </p>
    );
  };
  </script>

  <script type="text/babel">
  const CODE_DATA = {

        title: 'NDVI Analysis with Rasterio', lang: 'python',
        code: `import rasterio\nimport numpy as np\n\ndef calculate_ndvi(red_path, nir_path):\n    """Calculate NDVI from Red and Near-Infrared bands."""\n    with rasterio.open(red_path) as src:\n        red = src.read(1).astype(float)\n    with rasterio.open(nir_path) as src:\n        nir = src.read(1).astype(float)\n\n    np.seterr(divide='ignore', invalid='ignore')\n    ndvi = np.where(\n        (nir + red) == 0, 0,\n        (nir - red) / (nir + red)\n    )\n    return np.clip(ndvi, -1, 1)\n\nndvi = calculate_ndvi('red.tif', 'nir.tif')\nprint(f"Mean NDVI: {ndvi.mean():.3f}")\nprint(f"Healthy vegetation (>0.6): {(ndvi > 0.6).sum()} pixels")`,
      },
      {
        title: 'Forest Change Detection', lang: 'python',
        code: `import geopandas as gpd\nimport pandas as pd\n\ndef detect_change(gdf_before, gdf_after, threshold=5.0):\n    """Detect significant forest cover changes."""\n    merged = gdf_before.merge(\n        gdf_after[['plot_id', 'cover_pct']],\n        on='plot_id', suffixes=('_t1', '_t2')\n    )\n    merged['delta'] = merged['cover_pct_t2'] - merged['cover_pct_t1']\n    merged['class'] = pd.cut(\n        merged['delta'],\n        bins=[-float('inf'), -threshold, threshold, float('inf')],\n        labels=['Deforestation', 'Stable', 'Reforestation']\n    )\n    return merged\n\nresults = detect_change(gdf_2020, gdf_2024)\nprint(results['class'].value_counts())`,
      },
    ],
    sql: [
      {
        title: 'Spatial Query — High-NDVI Forest Plots', lang: 'sql',
        code: `-- Forest plots within 5 km of rivers, NDVI > 0.6\nSELECT\n    fp.plot_id,\n    fp.species_name,\n    fp.area_ha,\n    fp.ndvi_mean,\n    ROUND(\n        ST_Distance(fp.geom::geography, r.geom::geography) / 1000.0, 2\n    ) AS dist_river_km,\n    r.river_name\nFROM forest_plots fp\nCROSS JOIN LATERAL (\n    SELECT river_name, geom\n    FROM rivers\n    ORDER BY fp.geom <-> geom\n    LIMIT 1\n) r\nWHERE\n    ST_DWithin(fp.geom::geography, r.geom::geography, 5000)\n    AND fp.ndvi_mean > 0.6\n    AND fp.survey_year = 2024\nORDER BY fp.ndvi_mean DESC\nLIMIT 50;`,
      },
      {
        title: 'Watershed Forest Metrics', lang: 'sql',
        code: `SELECT\n    w.watershed_name,\n    COUNT(fp.plot_id)                        AS plot_count,\n    ROUND(SUM(fp.area_ha)::numeric, 2)       AS total_ha,\n    ROUND(AVG(fp.ndvi_mean)::numeric, 3)     AS avg_ndvi,\n    ROUND(AVG(fp.canopy_height)::numeric, 2) AS avg_canopy_m,\n    SUM(CASE WHEN fp.species = 'Pinus kesiya'\n             THEN fp.area_ha ELSE 0 END)     AS pine_ha\nFROM watersheds w\nLEFT JOIN forest_plots fp\n       ON ST_Within(fp.geom, w.geom)\n      AND fp.survey_year = 2024\nGROUP BY w.watershed_id, w.watershed_name\nHAVING COUNT(fp.plot_id) > 0\nORDER BY total_ha DESC;`,
      },
    ],
    js: [
      {
        title: 'Leaflet Forest Layer with NDVI Styling', lang: 'javascript',
        code: `const map = L.map('map').setView([12.0, 108.0], 8);\n\nL.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {\n    attribution: '© OpenStreetMap contributors'\n}).addTo(map);\n\nconst ndviColor = (v) =>\n    v > 0.7 ? '#1a6b1a' : v > 0.5 ? '#4caf50' :\n    v > 0.3 ? '#8bc34a' : v > 0.1 ? '#cddc39' : '#f44336';\n\nfetch('forest_plots.geojson')\n    .then(r => r.json())\n    .then(data => {\n        L.geoJSON(data, {\n            style: f => ({\n                fillColor:   ndviColor(f.properties.ndvi_mean),\n                weight:      1, opacity: 0.8,\n                color:       'white', fillOpacity: 0.75,\n            }),\n            onEachFeature: (f, l) => l.bindPopup(\n                \`<b>\${f.properties.species}</b><br>\` +\n                \`NDVI: \${f.properties.ndvi_mean.toFixed(3)}<br>\` +\n                \`Area: \${f.properties.area_ha} ha\`\n            ),\n        }).addTo(map);\n    });`,
      },
    ],
